# RestoreSafe configuration file
# Place this file in the same directory as RestoreSafe.exe.

# Source directories to back up.
# Paths may be absolute or relative to RestoreSafe.exe.
# On Windows, prefer forward slashes in YAML paths (C:/Users/...) to avoid escape issues.
source_directories:
  - "C:/Users/Username/Documents"
  - "C:/Users/Username/Pictures"

# Destination directory for encrypted backup files.
# Path may be absolute or relative to RestoreSafe.exe.
backup_directory: "C:/Backup"

# Maximum size of each split file (in MB).
# Default: 4096 MB (= 4 GB)
split_size_mb: 4096

# Retention: number of backup chains to keep per source directory. A chain is a
# full backup plus the differential backups based on it; it is always deleted as a
# whole, so a full backup is never deleted while a kept differential needs it.
# 0 = keep all backups (no automatic cleanup)
retention_keep: 3

# Differential backups store only the files that are new or changed since the
# last full backup. RestoreSafe decides automatically between full and
# differential and shows the decision before the backup starts; press [F] there
# to force a full backup.
differential:
  # false = every backup is a full backup. Default: true
  enabled: true
  # Create a new full backup when the latest full backup is this many days old.
  # Default: 30  |  Minimum: 1  |  Maximum: 365
  full_backup_interval_days: 30
  # Create a new full backup when the latest differential has reached this
  # percentage of the full backup's size (differentials grow over time, because
  # each one contains all changes since the full backup).
  # Default: 50  |  Minimum: 1  |  Maximum: 100
  max_size_percent: 50
  # Number of differential backups kept per chain; older ones are deleted first.
  # Each differential needs only its full backup, so deleting older ones never
  # affects newer ones. The newest differential is always kept.
  # 0 = keep all differentials (default)
  retention_keep_differentials: 0

# Files and directories to leave out of every backup (case-insensitive).
#   "*.tmp"           name pattern: matches at any depth
#   "node_modules"    a directory name: skipped with everything inside
#   "/Cache"          starts with "/" or contains "/": path from the source directory root
#   "logs/"           trailing "/": directories only
# Wildcards: * (any characters), ? (one character), [abc] (one of a, b, c).
# Default: none
exclude: []
#exclude:
#  - "*.tmp"
#  - "~$*"
#  - "Thumbs.db"
#  - "node_modules"

# What to do when a file cannot be read (e.g. locked by another program):
#   "fail" = abort the backup of that directory (default)
#   "skip" = continue, list the file as a warning, and keep older backups
#            of that directory until a backup without skipped files succeeds
on_unreadable_file: "fail"

# Log level: "info" (default) or "debug" (verbose output)
log_level: "info"

# Additional I/O diagnostics in debug log/console (write calls, average write size).
# Enable this only for storage or write-amplification troubleshooting.
io_diagnostics: false

# Verify the backup immediately after it is written.
# Re-reads and decrypts the new .enc parts (no extra password/YubiKey prompt)
# to confirm the backup restores. A failure is logged as a warning and the
# files are kept. Adds roughly one decrypt pass per backup run.
# Default: false
verify_after_backup: false

# Authentication mode.
# 1 = Password only (default)
# 2 = Password AND YubiKey FIDO2 hmac-secret (2FA)
# 3 = YubiKey only, no password
#     The YubiKey FIDO2 credential is the sole RestoreSafe authentication
#     factor. No password is prompted during backup or restore.
#     The YubiKey must support FIDO2 hmac-secret and have a FIDO2 PIN configured.
authentication_mode: 1

# Modes 2 and 3: register a second YubiKey as spare when new keys are created.
# Either YubiKey can then restore every backup made with those keys. The spare
# YubiKey is only needed once, when the keys are created.
# Default: false
yubikey_spare: false

# Create a recovery code when new keys are created. The code alone restores
# every backup made with those keys, even without password or YubiKey (also in
# mode 2). Write it down and store it offline, never next to your backups.
# Default: false
recovery_code: false

# Minimum password length (in characters) when new keys are created.
# Default: 12  |  Minimum: 8  |  Maximum: 256
password_min_length: 12

# Argon2id key-derivation parameters.
#
# RestoreSafe uses Argon2id (RFC 9106) to derive the AES-256 encryption key from
# your password. Argon2id is memory-hard, which makes GPU/ASIC-based brute-force
# attacks orders of magnitude more expensive than classic password hashing (bcrypt,
# PBKDF2, etc.).
#
# These three parameters control how much work is done each time the key is derived
# (once per backup run, once per restore). Higher values slow down legitimate use
# slightly, but make brute-force attacks proportionally harder — the cost grows for
# an attacker exactly as it grows for you.
#
# The values in effect at encryption time are stored in every backup file, so
# restore always uses the original parameters automatically. Changing these settings
# only affects new backups, not existing ones.
#
# Parameters and their effect:
#
#   argon2.time       — Number of passes (iterations) over the memory block.
#                       Each extra pass doubles the CPU time for key derivation.
#                       Default: 3  |  Minimum: 2  |  Maximum: 20
#                       Increasing to 4–8 raises security at moderate CPU cost.
#
#   argon2.memory_mb  — Working memory allocated per key derivation, in megabytes.
#                       This is the primary defence against GPU/ASIC attacks; a GPU
#                       cannot parallelise many attempts when each requires this much
#                       RAM. Doubling memory doubles RAM usage for the single derive
#                       call and roughly doubles attacker cost per guess.
#                       Default: 512 MB  |  Minimum: 64 MB  |  Maximum: 4096 MB
#                       Values of 1024–4096 MB are appropriate for high-security use.
#                       Do not set this higher than your available free RAM.
#                       IMPORTANT: Restore re-derives the key with the SAME memory_mb,
#                       so the machine you restore on must have at least this much RAM.
#
#   argon2.threads    — Degree of parallelism (CPU threads used per key derivation).
#                       Should match the number of physical cores available to the
#                       process. Does not change total work — it only controls how
#                       that work is spread across cores. An attacker with a machine
#                       that has fewer cores than this value gains no benefit from
#                       the extra threads setting.
#                       Default: 4  |  Minimum: 1  |  Maximum: 255
#                       Set to the number of CPU cores on your backup machine.
#
# The defaults (512 MB / 3 / 4) sit well above the OWASP Argon2id minimums and
# provide strong protection for typical hardware. Values below the stated minimums
# are rejected at startup; values above the stated maximums are capped to the
# maximum and reported as a warning in the startup health check.
argon2:
  time: 3
  memory_mb: 512
  threads: 4
