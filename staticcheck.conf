# Configuration for go tool staticcheck (https://staticcheck.dev/docs/checks).
#
# Enabled: all checks, including those staticcheck leaves off by default.
#
# Disabled:
# - ST1005 (error string style): error texts are user-facing sentences on
#   purpose, capitalised and with punctuation (refactoring 2.0 RF-25).
#
# Exempted per file:
