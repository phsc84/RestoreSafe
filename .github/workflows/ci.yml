# Checks every push and pull request on Windows, the only platform
# RestoreSafe supports (refactoring 2.0 RF-1).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Format, vet, build, static analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Build (release configuration)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: govulncheck
        run: go tool govulncheck ./...
      # A report only: a wrapper function added in one commit may get its
      # caller in the next.
      - name: deadcode (report)
        run: go tool deadcode -test ./...

  lockdiag:
    name: Lock diagnostic (temporary)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: |
          out=$(go run ./scripts/ci/lockdiag; whoami /priv | grep -iE "Backup|Restore")
          echo "$out"
          echo "::warning title=lockdiag::$(printf "%s" "$out" | awk 'BEGIN{ORS="%0A"} {print}')"

  test:
    name: Tests and coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test
        env:
          CGO_ENABLED: "0"
        run: |
          set -o pipefail
          go test -count=1 -coverprofile=cover.out ./... 2>&1 | tee test.log
      - name: Report failures
        if: failure()
        run: bash scripts/ci/annotate-failures.sh test.log
      - name: Coverage per function
        run: go tool cover -func=cover.out | tail -n 1
      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: cover.out

  race:
    name: Race detector
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # -race needs cgo and a gcc; the runner image has MinGW. Release builds
      # stay CGO_ENABLED=0.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: |
          gcc --version | head -n 1
          set -o pipefail
          go test -count=1 -race -timeout 45m ./... 2>&1 | tee test.log
      - name: Report failures
        if: failure()
        run: bash scripts/ci/annotate-failures.sh test.log
